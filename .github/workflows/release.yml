name: release
# A version tag (v1.2.3) builds the zip for the Chrome Web Store and attaches it to a GitHub release. Uploading it to the store
# stays a step of the maintainer.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - name: The tag matches the version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm build && pnpm package && unzip -tq sluice-*.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sluice-*.zip --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed."
